# docker compose run --rm sandbox init     create the wallet
# docker compose run --rm sandbox check    show its state
# MCP clients should use `docker run -i ...` (see examples/), not compose.
services:
  sandbox:
    build: .
    image: embarkai/agent-sandbox:local
    env_file:
      - path: .env
        required: false
    volumes:
      - embark-data:/data

volumes:
  embark-data:
    name: embark-data
